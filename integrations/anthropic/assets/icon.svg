<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="cGrad" x1="10" y1="30" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1BA39C"/>
      <stop offset="100%" stop-color="#0E847B"/>
    </linearGradient>
    <linearGradient id="vTopGrad" x1="80" y1="40" x2="160" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3CBDB5"/>
      <stop offset="100%" stop-color="#1BA39C"/>
    </linearGradient>
    <linearGradient id="vBotGrad" x1="100" y1="110" x2="100" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A6B65"/>
      <stop offset="100%" stop-color="#0D3D3A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- C letter — thick arc -->
  <path d="
    M 82 18
    C 35 18, 6 52, 6 92
    C 6 132, 35 166, 82 166
    L 82 138
    C 50 138, 32 118, 32 92
    C 32 66, 50 46, 82 46
    Z
  " fill="url(#cGrad)"/>

  <!-- V upper — two angled strokes forming a check/V -->
  <path d="
    M 78 42
    L 82 42
    L 120 96
    L 158 42
    L 162 42
    L 148 42
    L 120 78
    L 92 42
    Z
  " fill="url(#vTopGrad)"/>

  <!-- V lower — dark triangle (pin tip) -->
  <path d="
    M 72 112
    L 100 200
    L 128 112
    Z
  " fill="url(#vBotGrad)"/>

  <!-- ====================== -->
  <!-- NETWORK / VERNETZUNG   -->
  <!-- ====================== -->

  <!-- Connection lines — dashed, subtle -->
  <g stroke="#0E847B" stroke-width="1.2" stroke-dasharray="3 2.5" opacity="0.3">
    <!-- C top to V top-left -->
    <line x1="56" y1="34" x2="90" y2="46"/>
    <!-- C mid-left to V center -->
    <line x1="20" y1="92" x2="100" y2="88"/>
    <!-- V top-right to V bottom -->
    <line x1="152" y1="46" x2="110" y2="130"/>
    <!-- C bottom to V triangle -->
    <line x1="68" y1="150" x2="92" y2="160"/>
    <!-- V center peak to triangle top -->
    <line x1="120" y1="88" x2="100" y2="120"/>
    <!-- Cross diagonal -->
    <line x1="56" y1="34" x2="100" y2="120"/>
  </g>

  <!-- Glow behind lines -->
  <g stroke="#5EEAD4" stroke-width="1.8" opacity="0.2" filter="url(#glow)">
    <line x1="56" y1="34" x2="90" y2="46"/>
    <line x1="20" y1="92" x2="100" y2="88"/>
    <line x1="152" y1="46" x2="110" y2="130"/>
    <line x1="120" y1="88" x2="100" y2="120"/>
  </g>

  <!-- Network nodes -->
  <g filter="url(#glow)">
    <!-- Node 1: C top curve -->
    <circle cx="56" cy="34" r="4.5" fill="#0E847B"/>
    <circle cx="56" cy="34" r="2.5" fill="#5EEAD4"/>

    <!-- Node 2: V left arm start -->
    <circle cx="90" cy="46" r="4" fill="#0E847B"/>
    <circle cx="90" cy="46" r="2.2" fill="#5EEAD4"/>

    <!-- Node 3: V right arm end -->
    <circle cx="152" cy="46" r="4" fill="#0E847B"/>
    <circle cx="152" cy="46" r="2.2" fill="#5EEAD4"/>

    <!-- Node 4: C middle left -->
    <circle cx="20" cy="92" r="4.5" fill="#0E847B"/>
    <circle cx="20" cy="92" r="2.5" fill="#5EEAD4"/>

    <!-- Node 5: V peak center (hub node — larger, white core) -->
    <circle cx="120" cy="88" r="5.5" fill="#0E847B"/>
    <circle cx="120" cy="88" r="3" fill="#fff"/>

    <!-- Node 6: V/C overlap point (left body) -->
    <circle cx="100" cy="88" r="3.5" fill="#1BA39C"/>
    <circle cx="100" cy="88" r="2" fill="#5EEAD4"/>

    <!-- Node 7: C bottom -->
    <circle cx="68" cy="150" r="4" fill="#0E847B"/>
    <circle cx="68" cy="150" r="2.2" fill="#5EEAD4"/>

    <!-- Node 8: V triangle top -->
    <circle cx="100" cy="120" r="4.5" fill="#1A6B65"/>
    <circle cx="100" cy="120" r="2.5" fill="#5EEAD4"/>

    <!-- Node 9: V triangle right -->
    <circle cx="110" cy="130" r="3.5" fill="#1A6B65"/>
    <circle cx="110" cy="130" r="2" fill="#5EEAD4"/>

    <!-- Node 10: V triangle bottom tip -->
    <circle cx="100" cy="170" r="3.5" fill="#0D3D3A"/>
    <circle cx="100" cy="170" r="2" fill="#5EEAD4"/>
  </g>
</svg>
